<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>Live Transit Tracker — Сенд-мод</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>
    <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
    <style>
        * {
            box-sizing: border-box;
        }

        html, body {
            margin: 0;
            height: 100%;
            overflow: hidden;
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
            background: #111;
        }

        #map {
            width: 100%;
            height: 100%;
        }

        /* Адаптивная панель — для телефонов удобно */
        .panel {
            position: absolute;
            z-index: 1000;
            top: 12px;
            left: 12px;
            right: 12px;
            max-width: 480px;
            background: rgba(18, 18, 24, 0.96);
            backdrop-filter: blur(16px);
            color: #f0f0f0;
            padding: 16px 18px;
            border-radius: 28px;
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.5);
            border: 0.5px solid rgba(255, 255, 255, 0.2);
            transition: all 0.2s ease;
        }

        @media (max-width: 560px) {
            .panel {
                left: 10px;
                right: 10px;
                top: 10px;
                padding: 14px 16px;
                border-radius: 24px;
                max-width: none;
            }
            .title {
                font-size: 20px;
            }
            .big {
                font-size: 24px;
            }
            .stop-list {
                max-height: 180px;
            }
            button, input {
                padding: 12px;
                font-size: 16px;
            }
        }

        .title {
            font-size: 22px;
            font-weight: 700;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 8px;
            letter-spacing: -0.3px;
        }

        .line {
            margin-top: 10px;
            font-size: 15px;
            display: flex;
            flex-wrap: wrap;
            align-items: baseline;
            justify-content: space-between;
        }

        .big {
            font-size: 26px;
            font-weight: 800;
            color: #ffb347;
        }

        .status-dot {
            width: 10px;
            height: 10px;
            background: #2ecc71;
            border-radius: 50%;
            display: inline-block;
            margin-right: 8px;
            box-shadow: 0 0 4px #2ecc71;
        }

        .stop-list {
            margin-top: 18px;
            max-height: 200px;
            overflow-y: auto;
            border-top: 1px solid rgba(255, 255, 255, 0.2);
            padding-top: 12px;
            font-size: 14px;
            scrollbar-width: thin;
        }

        .stop {
            margin-top: 8px;
            padding: 6px 8px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            word-break: break-word;
        }

        .next-stop {
            background: rgba(77, 163, 255, 0.3);
            border-left: 4px solid #4da3ff;
            font-weight: 600;
            color: #c7e2ff;
        }

        input, button {
            border: none;
            border-radius: 40px;
            font-weight: 500;
            outline: none;
        }

        input {
            width: 100%;
            margin-top: 10px;
            padding: 12px 16px;
            background: rgba(30, 30, 38, 0.9);
            color: white;
            font-size: 15px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            transition: 0.2s;
        }

        input:focus {
            border-color: #4da3ff;
            background: #1e1e2a;
        }

        .button-group {
            display: flex;
            gap: 10px;
            margin-top: 12px;
            flex-wrap: wrap;
        }

        button {
            background: #2c3e66;
            color: white;
            padding: 12px 16px;
            font-size: 14px;
            cursor: pointer;
            transition: 0.2s;
            flex: 1;
            font-weight: 600;
        }

        button.primary {
            background: #4da3ff;
            box-shadow: 0 2px 6px rgba(77, 163, 255, 0.3);
        }

        button.danger {
            background: #6b2e2e;
        }

        button:hover {
            opacity: 0.9;
            transform: scale(0.98);
        }

        .coord-row {
            display: flex;
            gap: 8px;
            margin-top: 8px;
        }

        .coord-row input {
            flex: 1;
            margin-top: 0;
        }

        .flex-between {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        hr {
            margin: 16px 0 12px;
            border: none;
            border-top: 1px solid rgba(255, 255, 255, 0.15);
        }

        .label-icon {
            font-weight: 500;
            font-size: 13px;
            opacity: 0.8;
            margin-top: 8px;
            margin-bottom: 4px;
        }

        .leaflet-control-attribution {
            display: none;
        }
    </style>
</head>
<body>
<div id="map"></div>

<div class="panel" id="mainPanel">
    <div class="title">
        <span>🚆 LIVE TRANSIT</span>
        <span id="modeBadge" style="font-size: 12px; background: #2c3e66; padding: 4px 10px; border-radius: 40px;"></span>
    </div>

    <div class="line">
        <span><span class="status-dot"></span> <span id="status">Подключение...</span></span>
    </div>

    <div class="line">
        <span>Скорость:</span>
        <span class="big" id="speed">0</span>
        <span>км/ч</span>
    </div>

    <div class="line">
        <span>Следующая остановка:</span>
        <span id="nextStop" style="font-weight:500;">—</span>
    </div>

    <div class="line">
        <span>ETA:</span>
        <span id="eta">—</span>
    </div>

    <div class="line">
        <span>Обновление:</span>
        <span id="lastUpdate">—</span>
    </div>

    <div class="stop-list" id="stopList"></div>

    <!-- Блок редактора (только для send mode) -->
    <div id="editor" style="display:none">
        <hr>
        <div class="label-icon">🏷️ Название остановки</div>
        <input type="text" id="stopName" placeholder="Например: Центральный вокзал" autocomplete="off">

        <div class="label-icon">⏱️ Время (ETA формата 14:25 или текст)</div>
        <input type="text" id="stopTime" placeholder="14:25 или '5 мин'" autocomplete="off">

        <div class="label-icon">🌐 Координаты (широта / долгота)</div>
        <div class="coord-row">
            <input type="number" id="stopLat" step="any" placeholder="Широта (lat)" value="">
            <input type="number" id="stopLon" step="any" placeholder="Долгота (lon)" value="">
        </div>

        <div class="button-group">
            <button id="useMyLocationBtn" class="primary" type="button">📍 Моё местоположение</button>
        </div>

        <div class="button-group">
            <button id="addStopBtn" class="primary" type="button">➕ Добавить остановку</button>
            <button id="clearRouteBtn" class="danger" type="button">🗑️ Очистить маршрут</button>
        </div>
        <div style="font-size: 12px; margin-top: 8px; opacity:0.7; text-align:center;">
            💡 Введите lat/lon вручную или нажмите «Моё местоположение»
        </div>
    </div>
</div>

<script>
    // ----------------------------- FIREBASE -----------------------------
    const firebaseConfig = {
        apiKey: "AIzaSyAhBIzshLpZFRCt8ndMwWgSApkoL61lYW0",
        authDomain: "geoformytrip.firebaseapp.com",
        databaseURL: "https://geoformytrip-default-rtdb.europe-west1.firebasedatabase.app",
        projectId: "geoformytrip",
        storageBucket: "geoformytrip.firebasestorage.app",
        messagingSenderId: "1020098843524",
        appId: "1:1020098843524:web:48d1946193a229414b83d1",
        measurementId: "G-ZZQMKVYY34"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    // ----------------------------- MAP -----------------------------
    const map = L.map('map', { zoomControl: true }).setView([50.63, 3.06], 13);
    L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
        maxZoom: 19,
        attribution: '© OpenStreetMap'
    }).addTo(map);

    // ----------------------------- ОБЩИЕ ПЕРЕМЕННЫЕ -----------------------------
    let stops = [];            // массив объектов остановок {id, name, time, lat, lon}
    let stopMarkers = [];
    let routeLine = null;
    let vehicleMarker = null;

    // Иконка транспорта
    const vehicleIcon = L.divIcon({
        html: "🚆",
        className: "vehicle-marker",
        iconSize: [36, 36],
        popupAnchor: [0, -10]
    });

    // Инициализация маркера (будет использоваться в mode=view)
    vehicleMarker = L.marker([50.63, 3.06], { icon: vehicleIcon }).addTo(map);

    // ----------------------------- ВСПОМОГАТЕЛЬНЫЕ ФУНКЦИИ -----------------------------
    function distance(lat1, lon1, lat2, lon2) {
        const dx = (lat1 - lat2) * 111000;
        const dy = (lon1 - lon2) * 88000;
        return Math.sqrt(dx * dx + dy * dy);
    }

    // Обновление ближайшей остановки на основе текущей позиции
    function updateNearestStop(lat, lon) {
        if (!stops.length) {
            document.getElementById("nextStop").innerText = "—";
            document.getElementById("eta").innerText = "—";
            return;
        }

        let nearest = null;
        let bestDist = Infinity;
        stops.forEach(stop => {
            const d = distance(lat, lon, stop.lat, stop.lon);
            if (d < bestDist) {
                bestDist = d;
                nearest = stop;
            }
        });
        if (nearest) {
            document.getElementById("nextStop").innerText = nearest.name;
            document.getElementById("eta").innerText = nearest.time || "—";
            // Подсветка в списке
            document.querySelectorAll(".stop").forEach(el => el.classList.remove("next-stop"));
            const activeElem = document.getElementById("stop-" + nearest.id);
            if (activeElem) activeElem.classList.add("next-stop");
        } else {
            document.getElementById("nextStop").innerText = "—";
            document.getElementById("eta").innerText = "—";
        }
    }

    // Отрисовка маршрута и списка остановок из массива stops
    function renderRouteAndStops() {
        // Очистить старые маркеры и линии
        stopMarkers.forEach(m => map.removeLayer(m));
        stopMarkers = [];
        if (routeLine) map.removeLayer(routeLine);
        routeLine = null;

        const stopListDiv = document.getElementById("stopList");
        stopListDiv.innerHTML = "";

        if (!stops.length) return;

        const coords = [];
        // сортируем остановки по времени? но в исходном порядке как в объекте — оставим порядок добавления. 
        // но в объекте Firebase ключи не упорядочены, поэтому лучше хранить массив stops, который уже в порядке добавления.
        // При загрузке из базы данные приходят в произвольном порядке, но мы в loadRoute пересобираем stops в том порядке,
        // который получаем из entries. Чтобы сохранить порядок, лучше использовать массив, а ID прикреплять.
        // У нас stops - массив, наполненный в том порядке, в котором ключи итерируются. Но для визуального порядка можно сортировать по created,
        // но для простоты оставим как есть, но покажем в том порядке, как загружено. Можно добавить поле timestamp.
        stops.forEach(stop => {
            coords.push([stop.lat, stop.lon]);
            // маркер остановки
            const marker = L.marker([stop.lat, stop.lon], {
                title: stop.name
            }).addTo(map).bindPopup(`<b>${stop.name}</b><br>${stop.time || "без времени"}`);
            stopMarkers.push(marker);

            // пункт в списке остановок
            const div = document.createElement("div");
            div.className = "stop";
            div.id = "stop-" + stop.id;
            div.innerHTML = `<span>${stop.time ? stop.time + " — " : ""}${stop.name}</span>`;
            stopListDiv.appendChild(div);
        });

        // Рисуем полилинию маршрута, если >= 2 точки
        if (coords.length >= 2) {
            routeLine = L.polyline(coords, {
                color: '#4da3ff',
                weight: 5,
                smoothFactor: 1.5,
                opacity: 0.85
            }).addTo(map);
            map.fitBounds(routeLine.getBounds().pad(0.1));
        } else if (coords.length === 1) {
            map.setView([coords[0][0], coords[0][1]], 14);
        }
    }

    // Загрузка маршрута из Firebase (коллекция "route")
    function loadRoute() {
        db.ref("route").on("value", snap => {
            const data = snap.val();
            stops = [];

            if (data) {
                // Преобразуем объект в массив, сохраняя id и сортируя по created (если есть) для логичного порядка
                const tempStops = [];
                Object.entries(data).forEach(([id, stopData]) => {
                    tempStops.push({
                        id: id,
                        name: stopData.name || "Без названия",
                        time: stopData.time || "",
                        lat: parseFloat(stopData.lat),
                        lon: parseFloat(stopData.lon),
                        created: stopData.created || 0
                    });
                });
                // Сортировка по времени создания (старые первыми - порядок маршрута)
                tempStops.sort((a, b) => (a.created || 0) - (b.created || 0));
                stops = tempStops;
            }
            renderRouteAndStops();

            // Если в view-режиме уже есть данные о позиции, обновить ближайшую остановку
            const currentLive = window._currentLiveData;
            if (currentLive) {
                updateNearestStop(currentLive.lat, currentLive.lon);
            }
        });
    }

    // Добавление остановки (send mode - берём данные из полей)
    function addStopFromForm() {
        const name = document.getElementById("stopName").value.trim();
        const time = document.getElementById("stopTime").value.trim();
        let lat = parseFloat(document.getElementById("stopLat").value);
        let lon = parseFloat(document.getElementById("stopLon").value);

        if (!name) {
            alert("Введите название остановки");
            return;
        }
        if (isNaN(lat) || isNaN(lon)) {
            alert("Введите корректные координаты (широту и долготу) или нажмите 'Моё местоположение'");
            return;
        }
        if (lat < -90 || lat > 90 || lon < -180 || lon > 180) {
            alert("Координаты выходят за допустимые пределы (-90..90, -180..180)");
            return;
        }

        const newStop = {
            name: name,
            time: time || "",
            lat: lat,
            lon: lon,
            created: Date.now()
        };

        db.ref("route").push(newStop).then(() => {
            // Очистим форму после успешного добавления
            document.getElementById("stopName").value = "";
            document.getElementById("stopTime").value = "";
            document.getElementById("stopLat").value = "";
            document.getElementById("stopLon").value = "";
            // Небольшая обратная связь
            const btn = document.getElementById("addStopBtn");
            const originalText = btn.innerText;
            btn.innerText = "✓ Добавлено!";
            setTimeout(() => { btn.innerText = originalText; }, 1200);
        }).catch(err => {
            alert("Ошибка при добавлении: " + err.message);
        });
    }

    // Очистка всего маршрута
    function clearFullRoute() {
        if (confirm("⚠️ Удалить все остановки маршрута безвозвратно?")) {
            db.ref("route").remove().then(() => {
                alert("Маршрут очищен");
            }).catch(e => alert("Ошибка: " + e.message));
        }
    }

    // Заполнить поля координат текущей геопозицией (для send mode)
    function fillCurrentLocation() {
        if (!navigator.geolocation) {
            alert("Геолокация не поддерживается браузером");
            return;
        }
        navigator.geolocation.getCurrentPosition(
            pos => {
                document.getElementById("stopLat").value = pos.coords.latitude.toFixed(6);
                document.getElementById("stopLon").value = pos.coords.longitude.toFixed(6);
                // дополнительный визуальный фидбек
                const btn = document.getElementById("useMyLocationBtn");
                const orig = btn.innerText;
                btn.innerText = "✅ Готово";
                setTimeout(() => { btn.innerText = orig; }, 1500);
            },
            err => {
                console.warn(err);
                alert("Не удалось получить геопозицию: " + (err.message || "проверьте разрешения"));
            },
            { enableHighAccuracy: true, timeout: 10000 }
        );
    }

    // ----------------------------- РЕЖИМ ОТПРАВКИ (SEND) -----------------------------
    function initSendMode() {
        document.getElementById("status").innerText = "📡 Телефон отправляет GPS";
        document.getElementById("modeBadge").innerText = "📤 SEND MODE";
        document.getElementById("editor").style.display = "block";
        // Навешиваем события на кнопки в редакторе
        document.getElementById("addStopBtn").onclick = addStopFromForm;
        document.getElementById("clearRouteBtn").onclick = clearFullRoute;
        document.getElementById("useMyLocationBtn").onclick = fillCurrentLocation;

        // Отправка геолокации каждые 2 секунды
        let sendInterval = setInterval(() => {
            if (!navigator.geolocation) return;
            navigator.geolocation.getCurrentPosition(
                pos => {
                    const lat = pos.coords.latitude;
                    const lon = pos.coords.longitude;
                    const speed = (pos.coords.speed || 0) * 3.6;
                    db.ref("live").set({
                        lat: lat,
                        lon: lon,
                        speed: speed,
                        time: Date.now()
                    }).catch(console.warn);
                    // Также можно отображать скорость на панели (для обратной связи)
                    const speedElem = document.getElementById("speed");
                    if (speedElem) speedElem.innerText = Math.round(speed);
                    document.getElementById("lastUpdate").innerText = new Date().toLocaleTimeString();

                    // В send mode тоже полезно видеть своё местоположение на карте
                    if (vehicleMarker) {
                        vehicleMarker.setLatLng([lat, lon]);
                        map.panTo([lat, lon], { animate: true, duration: 0.5 });
                    }
                    // Обновить ближайшую остановку (если маршрут загружен)
                    updateNearestStop(lat, lon);
                },
                err => {
                    console.warn("GPS ошибка:", err);
                    document.getElementById("status").innerHTML = "⚠️ Ошибка GPS";
                },
                { enableHighAccuracy: true, maximumAge: 2000, timeout: 8000 }
            );
        }, 2000);

        // сохраняем interval для очистки (необязательно)
        window._sendInterval = sendInterval;
    }

    // ----------------------------- РЕЖИМ ПРОСМОТРА (VIEW) -----------------------------
    function initViewMode() {
        document.getElementById("status").innerText = "📱 Планшет получает GPS";
        document.getElementById("modeBadge").innerText = "👁️ VIEW MODE";
        document.getElementById("editor").style.display = "none";

        // Слушаем обновления от Firebase "live"
        db.ref("live").on("value", snap => {
            const data = snap.val();
            if (!data) return;
            window._currentLiveData = data;
            // Обновляем маркер
            if (vehicleMarker) {
                vehicleMarker.setLatLng([data.lat, data.lon]);
                map.panTo([data.lat, data.lon], { animate: true, duration: 0.8 });
            }
            document.getElementById("speed").innerText = Math.round(data.speed || 0);
            document.getElementById("lastUpdate").innerText = new Date(data.time).toLocaleTimeString();
            // ближайшая остановка (используем загруженный маршрут)
            if (stops.length) {
                updateNearestStop(data.lat, data.lon);
            }
        });
    }

    // ----------------------------- ОПРЕДЕЛЕНИЕ РЕЖИМА ПО ПАРАМЕТРУ mode -----------------------------
    const urlParams = new URLSearchParams(window.location.search);
    const mode = urlParams.get("mode"); // "send" или "view"

    // Загружаем маршрут (общая логика)
    loadRoute();

    // Активируем нужный режим
    if (mode === "send") {
        initSendMode();
        // дополнительно: показываем кнопки управления картой для удобства на телефоне
        map.zoomControl.setPosition('bottomright');
    } else {
        initViewMode();
        // если view режим, добавляем подсказку, что редактирование скрыто
        map.zoomControl.setPosition('bottomright');
    }

    // Небольшой трюк: если в send mode и нет данных о остановках, можно ориентировать карту
    // также для телефонов улучшим поведение при клике на маркеры и масштабирование
    setTimeout(() => {
        if (stops.length === 0 && mode !== "send") {
            // просто показываем карту по умолчанию
            map.setView([50.63, 3.06], 13);
        } else if (stops.length && mode !== "send") {
            try {
                const bounds = L.latLngBounds(stops.map(s => [s.lat, s.lon]));
                map.fitBounds(bounds.pad(0.1));
            } catch(e) {}
        }
    }, 500);
</script>
</body>
</html>
