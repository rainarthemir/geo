<!DOCTYPE html>
<html lang="ru">
<head>

<meta charset="utf-8">
<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Live Transit Tracker</title>

<link rel="stylesheet"
href="https://unpkg.com/leaflet/dist/leaflet.css"/>

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>

<style>

html, body {
    margin: 0;
    height: 100%;
    overflow: hidden;
    font-family: Arial, sans-serif;
    background: #111;
}

#map {
    width: 100%;
    height: 100%;
}

.panel {

    position: absolute;
    z-index: 1000;

    top: 15px;
    left: 15px;

    width: 320px;

    background: rgba(20,20,20,0.92);

    color: white;

    padding: 18px;

    border-radius: 18px;

    backdrop-filter: blur(10px);

    box-shadow: 0 0 25px rgba(0,0,0,0.45);

}

.title {

    font-size: 24px;
    font-weight: bold;

    margin-bottom: 15px;

}

.line {

    margin-top: 10px;
    font-size: 16px;

}

.big {

    font-size: 28px;
    font-weight: bold;

}

.status-dot {

    width: 10px;
    height: 10px;

    background: lime;

    border-radius: 50%;

    display: inline-block;

    margin-right: 8px;

}

.stop-list {

    margin-top: 16px;

    max-height: 220px;

    overflow-y: auto;

    border-top: 1px solid rgba(255,255,255,0.15);

    padding-top: 10px;

}

.stop {

    margin-top: 6px;

    opacity: 0.7;

}

.next-stop {

    opacity: 1;

    color: #4da3ff;

    font-weight: bold;

}

input {

    width: 100%;

    margin-top: 8px;

    padding: 10px;

    border: none;

    border-radius: 10px;

    box-sizing: border-box;

}

button {

    width: 100%;

    margin-top: 10px;

    padding: 12px;

    border: none;

    border-radius: 10px;

    background: #4da3ff;

    color: white;

    font-size: 15px;

    cursor: pointer;

}

button:hover {

    opacity: 0.9;

}

.leaflet-control-attribution {
    display: none;
}

hr {

    border: none;
    border-top: 1px solid rgba(255,255,255,0.15);

    margin-top: 15px;
    margin-bottom: 15px;

}

</style>
</head>

<body>

<div class="panel">

    <div class="title">
        🚆 LIVE TRANSIT
    </div>

    <div class="line">
        <span class="status-dot"></span>
        <span id="status">
            Подключение...
        </span>
    </div>

    <div class="line">
        Скорость:
        <span class="big" id="speed">
            0
        </span>
        км/ч
    </div>

    <div class="line">
        Следующая остановка:
        <span id="nextStop">—</span>
    </div>

    <div class="line">
        ETA:
        <span id="eta">—</span>
    </div>

    <div class="line">
        Последнее обновление:
        <span id="lastUpdate">—</span>
    </div>

    <div class="stop-list"
    id="stopList"></div>

    <div id="editor"
    style="display:none">

        <hr>

        <input
        id="stopName"
        placeholder="Название остановки">

        <input
        id="stopTime"
        placeholder="14:25">

        <button onclick="addStop()">
            Добавить остановку
        </button>

        <button onclick="clearRoute()">
            Очистить маршрут
        </button>

    </div>

</div>

<div id="map"></div>

<script>

// ================= FIREBASE =================

const firebaseConfig = {

  apiKey: "AIzaSyAhBIzshLpZFRCt8ndMwWgSApkoL61lYW0",

  authDomain: "geoformytrip.firebaseapp.com",

  databaseURL:
  "https://geoformytrip-default-rtdb.europe-west1.firebasedatabase.app",

  projectId: "geoformytrip",

  storageBucket:
  "geoformytrip.firebasestorage.app",

  messagingSenderId:
  "1020098843524",

  appId:
  "1:1020098843524:web:48d1946193a229414b83d1",

  measurementId:
  "G-ZZQMKVYY34"

};

firebase.initializeApp(firebaseConfig);

const db = firebase.database();

// ================= MAP =================

const map = L.map('map', {
    zoomControl: false
}).setView([50.63, 3.06], 13);

L.tileLayer(
'https://tile.openstreetmap.org/{z}/{x}/{y}.png',
{
    maxZoom: 19
}).addTo(map);

// ================= VEHICLE =================

const vehicleIcon = L.divIcon({

    html: "🚆",

    className: "",

    iconSize: [32,32]

});

const marker = L.marker(
[50.63, 3.06],
{
    icon: vehicleIcon
}).addTo(map);

// ================= DATA =================

let stops = [];

let stopMarkers = [];

let routeLine = null;

// ================= HELPERS =================

function distance(lat1, lon1, lat2, lon2) {

    const dx = lat1 - lat2;
    const dy = lon1 - lon2;

    return Math.sqrt(dx*dx + dy*dy);

}

function updateNearestStop(lat, lon) {

    if(stops.length === 0) return;

    let nearest = null;

    let best = 999999;

    stops.forEach(stop => {

        const d = distance(
            lat,
            lon,
            stop.lat,
            stop.lon
        );

        if(d < best) {

            best = d;

            nearest = stop;

        }

    });

    document.getElementById("nextStop")
    .innerText = nearest.name;

    document.getElementById("eta")
    .innerText = nearest.time;

    document.querySelectorAll(".stop")
    .forEach(el => {

        el.classList.remove(
            "next-stop"
        );

    });

    const active =
    document.getElementById(
    "stop-" + nearest.id
    );

    if(active)
        active.classList.add(
            "next-stop"
        );

}

// ================= ROUTE =================

function loadRoute() {

    db.ref("route").on("value", snap => {

        const data = snap.val();

        stops = [];

        stopMarkers.forEach(m => {
            map.removeLayer(m);
        });

        stopMarkers = [];

        if(routeLine)
            map.removeLayer(routeLine);

        document.getElementById(
        "stopList"
        ).innerHTML = "";

        if(!data) return;

        Object.entries(data)
        .forEach(([id, stop]) => {

            stop.id = id;

            stops.push(stop);

        });

        const coords = [];

        stops.forEach(stop => {

            coords.push([
                stop.lat,
                stop.lon
            ]);

            // маркер остановки

            const stopMarker =
            L.marker([
                stop.lat,
                stop.lon
            ])
            .addTo(map)
            .bindPopup(
                stop.name
            );

            stopMarkers.push(
                stopMarker
            );

            // список остановок

            const div =
            document.createElement("div");

            div.className = "stop";

            div.id =
            "stop-" + stop.id;

            div.innerHTML =
            `${stop.time} — ${stop.name}`;

            document.getElementById(
            "stopList"
            ).appendChild(div);

        });

        // автоматический маршрут

        if(coords.length >= 2) {

            routeLine =
            L.polyline(coords, {

                color: '#4da3ff',

                weight: 6,

                smoothFactor: 2

            }).addTo(map);

            map.fitBounds(
                routeLine.getBounds()
            );

        }

    });

}

// ================= ADD STOP =================

function addStop() {

    navigator.geolocation.getCurrentPosition(pos => {

        const stop = {

            name:
            document.getElementById(
            "stopName"
            ).value,

            time:
            document.getElementById(
            "stopTime"
            ).value,

            lat:
            pos.coords.latitude,

            lon:
            pos.coords.longitude,

            created:
            Date.now()

        };

        db.ref("route")
        .push(stop);

        document.getElementById(
        "stopName"
        ).value = "";

        document.getElementById(
        "stopTime"
        ).value = "";

    });

}

// ================= CLEAR ROUTE =================

function clearRoute() {

    if(confirm(
    "Очистить маршрут?"
    )) {

        db.ref("route")
        .remove();

    }

}

// ================= LOAD ROUTE =================

loadRoute();

// ================= MODE =================

const params =
new URLSearchParams(
location.search
);

const mode =
params.get("mode");

// ================= SEND MODE =================

if(mode === "send") {

    document.getElementById(
    "status"
    ).innerText =
    "Телефон отправляет GPS";

    document.getElementById(
    "editor"
    ).style.display = "block";

    setInterval(() => {

        navigator.geolocation
        .getCurrentPosition(

            pos => {

                const lat =
                pos.coords.latitude;

                const lon =
                pos.coords.longitude;

                const speed =
                (pos.coords.speed || 0)
                * 3.6;

                db.ref("live").set({

                    lat,
                    lon,

                    speed,

                    time: Date.now()

                });

            },

            err => {

                console.log(err);

            },

            {

                enableHighAccuracy: true,

                maximumAge: 0,

                timeout: 5000

            }

        );

    }, 2000);

}

// ================= VIEW MODE =================

else {

    document.getElementById(
    "status"
    ).innerText =
    "Планшет получает GPS";

    db.ref("live")
    .on("value", snap => {

        const data = snap.val();

        if(!data) return;

        marker.setLatLng([
            data.lat,
            data.lon
        ]);

        map.panTo([
            data.lat,
            data.lon
        ], {

            animate: true,

            duration: 1

        });

        document.getElementById(
        "speed"
        ).innerText =
        Math.round(data.speed);

        document.getElementById(
        "lastUpdate"
        ).innerText =
        new Date(data.time)
        .toLocaleTimeString();

        updateNearestStop(
            data.lat,
            data.lon
        );

    });

}

</script>

</body>
</html>
